name: discord-badge
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate badge
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node .github/scripts/gen-discord-badge.mjs
      - name: Commit if changed
        run: |
          git config user.name "pupnoodle"
          git config user.email "dobryfraudzichaxd@proton.me"
          git add .github/assets/discord.svg
          git diff --cached --quiet || git commit -m "Update discord member badge"
          git push
